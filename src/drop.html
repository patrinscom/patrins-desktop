<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patrins Quick Upload</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:       #0e0f14;
  --surface:  #161820;
  --surface2: #1e2029;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.11);
  --text:     #e8e6f0;
  --text2:    #6b6d80;
  --text3:    #3a3c4a;
  --accent:   #5662ff;
  --accent2:  #818cf8;
  --green:    #34d399;
  --red:      #f87171;
}

body {
  font-family: 'Geist', -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 14px;
  height: 100vh;
  overflow: hidden;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  display: flex;
  flex-direction: column;
}

/* ── Title bar ─────────────────────────────────────────────────────────── */
.titlebar {
  -webkit-app-region: drag;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 14px 10px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-icon {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

.brand-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}

.brand-badge {
  font-size: 10.5px;
  font-weight: 500;
  color: var(--text2);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 1px 6px;
  letter-spacing: 0;
}

.close-btn {
  -webkit-app-region: no-drag;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: transparent;
  border: 1px solid transparent;
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .12s, border-color .12s, color .12s;
}
.close-btn:hover {
  background: rgba(255,255,255,0.06);
  border-color: var(--border2);
  color: var(--text);
}
.close-btn svg { display: block; }

/* ── Drop zone ─────────────────────────────────────────────────────────── */
.drop-area {
  -webkit-app-region: no-drag;
  margin: 12px 12px 0;
  flex-shrink: 0;
  border-radius: 10px;
  border: 1.5px dashed var(--text3);
  background: transparent;
  height: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: border-color .15s, background .15s;
  position: relative;
  overflow: hidden;
  cursor: default;
}

.drop-area::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 50%, rgba(86,98,255,0) 0%, rgba(86,98,255,0) 100%);
  transition: background .2s;
  pointer-events: none;
}

.drop-area.hover {
  border-color: var(--accent);
  border-style: solid;
}
.drop-area.hover::before {
  background: radial-gradient(ellipse at 50% 50%, rgba(86,98,255,0.08) 0%, rgba(86,98,255,0) 80%);
}

.drop-area.uploading {
  border-color: rgba(86,98,255,0.5);
  border-style: solid;
}

.drop-icon {
  width: 36px;
  height: 36px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .15s, background .15s;
}
.drop-area.hover .drop-icon {
  background: rgba(86,98,255,0.15);
  border-color: rgba(86,98,255,0.3);
  transform: translateY(-2px);
}

.drop-icon svg { display: block; }

.drop-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text2);
  transition: color .15s;
}
.drop-area.hover .drop-label { color: var(--text); }

.drop-sub {
  font-size: 11px;
  color: var(--text3);
  transition: color .15s;
}
.drop-area.hover .drop-sub { color: var(--text2); }

/* ── Pick file button ─────────────────────────────────────────────────── */
.pick-row {
  -webkit-app-region: no-drag;
  padding: 8px 12px 0;
  flex-shrink: 0;
}

.pick-btn {
  width: 100%;
  height: 30px;
  border-radius: 7px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text2);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background .12s, border-color .12s, color .12s;
}
.pick-btn:hover {
  background: var(--surface2);
  border-color: rgba(255,255,255,0.15);
  color: var(--text);
}
.pick-btn svg { display: block; }

/* ── File list ─────────────────────────────────────────────────────────── */
.divider {
  height: 1px;
  background: var(--border);
  margin: 10px 12px 0;
  flex-shrink: 0;
}

.files-scroll {
  -webkit-app-region: no-drag;
  flex: 1;
  overflow-y: auto;
  padding: 6px 8px 8px;
  min-height: 0;
}

.files-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  font-size: 11.5px;
  color: var(--text3);
}

.file-row {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-rows: auto auto;
  align-items: center;
  gap: 2px 10px;
  padding: 7px 8px;
  border-radius: 8px;
  transition: background .1s;
  margin-bottom: 1px;
}
.file-row:hover { background: var(--surface); }

.file-name {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  grid-column: 1;
  grid-row: 1;
}
.file-status {
  font-size: 11.5px;
  font-weight: 500;
  grid-column: 2;
  grid-row: 1;
  white-space: nowrap;
  flex-shrink: 0;
}
.file-status.uploading { color: var(--accent2); }
.file-status.done      { color: var(--green); }
.file-status.error     { color: var(--red); }

.file-bar-wrap {
  grid-column: 1 / -1;
  grid-row: 2;
  height: 2px;
  background: rgba(255,255,255,0.05);
  border-radius: 99px;
  overflow: hidden;
}
.file-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width .25s ease;
}
.file-bar-fill.done  { background: var(--green); }
.file-bar-fill.error { background: var(--red); }

/* ── Scrollbar ─────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }
</style>
</head>
<body>

<!-- Title bar -->
<div class="titlebar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8EA5FF"/><stop offset="1" stop-color="#4F5BFF"/></linearGradient>
        <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4F5BFF"/><stop offset="1" stop-color="#3741D6"/></linearGradient>
        <linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3741D6"/><stop offset="1" stop-color="#2E36B8"/></linearGradient>
      </defs>
      <rect x="14" y="56" width="86" height="56" rx="12" fill="url(#c)"/>
      <rect x="22" y="40" width="86" height="56" rx="12" fill="url(#b)"/>
      <rect x="30" y="24" width="86" height="56" rx="12" fill="url(#a)"/>
    </svg>
    <span class="brand-name">Patrins</span>
    <span class="brand-badge">Quick Upload</span>
  </div>
  <button class="close-btn" id="closeBtn" title="Close">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
</div>

<!-- Drop zone -->
<div class="drop-area" id="dropArea">
  <div class="drop-icon">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6b6d80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
  </div>
  <div class="drop-label">Drop files here to upload</div>
  <div class="drop-sub">Link copied to clipboard automatically</div>
</div>

<!-- Pick file button -->
<div class="pick-row">
  <button class="pick-btn" id="pickBtn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
    Browse and pick a file
  </button>
</div>

<div class="divider"></div>

<!-- File list -->
<div class="files-scroll" id="filesScroll">
  <div class="files-empty" id="filesEmpty">Uploads will appear here</div>
</div>

<script>
const dropArea   = document.getElementById('dropArea');
const filesScroll = document.getElementById('filesScroll');
const filesEmpty  = document.getElementById('filesEmpty');
const closeBtn   = document.getElementById('closeBtn');
const pickBtn    = document.getElementById('pickBtn');

closeBtn.addEventListener('click', () => window.dropApi.close());

// ── Drag events ──────────────────────────────────────────────────────────────
document.addEventListener('dragover', (e) => { e.preventDefault(); dropArea.classList.add('hover'); });
document.addEventListener('dragleave', (e) => {
  if (!e.relatedTarget || e.relatedTarget === document.documentElement) {
    dropArea.classList.remove('hover');
  }
});
document.addEventListener('drop', (e) => {
  e.preventDefault();
  dropArea.classList.remove('hover');
  const files = Array.from(e.dataTransfer.files);
  if (files.length) enqueue(files);
});

// ── Pick file ────────────────────────────────────────────────────────────────
pickBtn.addEventListener('click', async () => {
  pickBtn.disabled = true;
  const result = await window.dropApi.pickFile();
  pickBtn.disabled = false;
  if (result) enqueue([result]);
});

// ── Queue ────────────────────────────────────────────────────────────────────
const queue = [];
let busy = false;

function enqueue(files) {
  for (const f of files) {
    // f is a File (from drop) or { path, name, size } (from pick)
    const item = f.path
      ? { path: f.path, name: f.name || f.path.split(/[\\/]/).pop(), size: f.size }
      : f; // already shaped
    queue.push(item);
    addRow(item.name);
  }
  drain();
}

async function drain() {
  if (busy || !queue.length) return;
  busy = true;
  dropArea.classList.add('uploading');
  while (queue.length) {
    const item = queue.shift();
    const result = await window.dropApi.upload(item.path, item.name, item.size);
    finalizeRow(item.name, result.ok, result.error);
  }
  dropArea.classList.remove('uploading');
  busy = false;
}

// ── File rows ────────────────────────────────────────────────────────────────
const rows = new Map(); // name → { fill, statusEl }

function addRow(name) {
  if (filesEmpty) filesEmpty.style.display = 'none';

  const row = document.createElement('div');
  row.className = 'file-row';
  row.innerHTML = `
    <span class="file-name" title="${esc(name)}">${esc(name)}</span>
    <span class="file-status uploading">Uploading…</span>
    <div class="file-bar-wrap">
      <div class="file-bar-fill" style="width:0%"></div>
    </div>
  `;
  filesScroll.prepend(row);
  rows.set(name, {
    fill:     row.querySelector('.file-bar-fill'),
    statusEl: row.querySelector('.file-status'),
  });
}

function finalizeRow(name, ok, errMsg) {
  const r = rows.get(name);
  if (!r) return;
  r.fill.style.width = '100%';
  r.fill.classList.add(ok ? 'done' : 'error');
  r.statusEl.className = 'file-status ' + (ok ? 'done' : 'error');
  r.statusEl.textContent = ok ? '✓ Done' : '✗ Failed';
  if (!ok && errMsg) r.statusEl.title = errMsg;
}

window.dropApi.onProgress(({ name, pct }) => {
  const r = rows.get(name);
  if (r) r.fill.style.width = pct + '%';
});

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>

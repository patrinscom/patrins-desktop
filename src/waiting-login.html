<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patrins — Signing In</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #111110;
  color: #e8e6e1;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}
canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}
.center {
  position: relative;
  z-index: 1;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: up .7s cubic-bezier(.16,1,.3,1) both;
}
.logo-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 36px;
}
.logo-svg { width: 34px; height: 34px; }
.logo-name {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: #e8e6e1;
}
h1 {
  font-size: 24px;
  font-weight: 500;
  letter-spacing: -0.025em;
  color: #e8e6e1;
  margin-bottom: 10px;
}
.sub {
  font-size: 14px;
  color: #8a8880;
  line-height: 1.6;
  margin-bottom: 28px;
}
.waiting {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: #5a5856;
}
.dots { display: flex; gap: 5px; }
.dots span {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #6366f1;
  animation: blink 1.4s ease-in-out infinite;
}
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; transform: scale(.8); }
  40%            { opacity: 1;   transform: scale(1); }
}
@keyframes up {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="center">
  <div class="logo-row">
    <svg class="logo-svg" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8EA5FF"/><stop offset="1" stop-color="#4F5BFF"/></linearGradient>
        <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4F5BFF"/><stop offset="1" stop-color="#3741D6"/></linearGradient>
        <linearGradient id="d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3741D6"/><stop offset="1" stop-color="#2E36B8"/></linearGradient>
      </defs>
      <rect x="14" y="56" width="86" height="56" rx="12" fill="url(#d)"/>
      <rect x="14.5" y="56.5" width="85" height="55" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".18"/>
      <rect x="22" y="40" width="86" height="56" rx="12" fill="url(#b)"/>
      <rect x="22.5" y="40.5" width="85" height="55" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".22"/>
      <rect x="30" y="24" width="86" height="56" rx="12" fill="url(#a)"/>
      <rect x="30.5" y="24.5" width="85" height="55" rx="11.5" fill="none" stroke="#fff" stroke-opacity=".35"/>
      <path d="M30 36 Q73 28 116 36" stroke="#fff" stroke-opacity=".25" stroke-width="1.5" fill="none"/>
    </svg>
    <span class="logo-name">Patrins</span>
  </div>
  <h1>Completing sign-in</h1>
  <p class="sub">Finish signing in with Google in your browser,<br>then come back here.</p>
  <div class="waiting">
    <div class="dots"><span></span><span></span><span></span></div>
    Waiting for your browser
  </div>
</div>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, particles;
  const COLORS = ['#6366f1','#818cf8','#4f46e5','#a5b4fc','#4f5bff','#8b5cf6','#7c3aed','#3741d6'];

  function init() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    const COUNT = Math.min(160, Math.floor(W * H / 6000));
    particles = Array.from({ length: COUNT }, () => spawn(true));
  }

  function spawn(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : H + 8,
      w: 2 + Math.random() * 7,
      h: 1.2 + Math.random() * 2.8,
      angle: Math.random() * Math.PI * 2,
      vy: 0.25 + Math.random() * 0.6,
      vx: (Math.random() - 0.5) * 0.35,
      vr: (Math.random() - 0.5) * 0.018,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      alpha: 0.25 + Math.random() * 0.55,
    };
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
      p.y -= p.vy; p.x += p.vx; p.angle += p.vr;
      if (p.y < -10) particles[i] = spawn(false);
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', init);
  init();
  frame();
})();
</script>
</body>
</html>
